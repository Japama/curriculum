server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Compresión: el bundle es JS/CSS/texto, se beneficia bastante.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Cabeceras de seguridad. Ojo: en nginx, una location con su propio
    # `add_header` descarta los del bloque padre, así que se repiten en cada
    # location que añade cabeceras propias.
    #
    # Sin CSP estricta todavía: el JSON-LD de index.html es un script inline y
    # habría que calcular su hash antes de activarla.
    include /etc/nginx/conf.d/security-headers.conf;

    # Los assets llevan hash en el nombre: cachearlos es seguro.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Los binarios de fuentes también se cachean fuerte.
    location ~* \.(woff2?|png|jpe?g|svg|ico)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # El HTML y los metadatos, siempre frescos.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /robots.txt {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Rutas del cliente: cualquier URL desconocida sirve la aplicación.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
