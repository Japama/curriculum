<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Juan Bautista Valero Carrasco — Desarrollador de software y SaaS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d" />
      <stop offset="1" stop-color="#0b1120" />
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.42" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55" />
  <rect width="1200" height="630" fill="url(#glowA)" />
  <rect width="1200" height="630" fill="url(#glowB)" />

  <!-- Monograma -->
  <g transform="translate(96 84)">
    <rect width="88" height="88" rx="24" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.45" />
    <text x="44" y="57" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#22d3ee">JB</text>
  </g>

  <text x="96" y="252" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#e2e8f0">Juan Bautista Valero Carrasco</text>

  <text x="96" y="316" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="34" fill="#38bdf8">Desarrollador de software y SaaS</text>

  <rect x="96" y="356" width="132" height="5" rx="2.5" fill="url(#accent)" />

  <text x="96" y="420" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8">Profeasy · evaluación competencial en FP</text>
  <text x="96" y="462" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8">ProEntreno · gestión de clubes deportivos</text>

  <text x="96" y="556" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#64748b">juanbautistavalero.com</text>
</svg>
